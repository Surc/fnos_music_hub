name: Core and web checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m ruff check hub modules tests scripts packaging/fpk
      - run: for script in packaging/fpk/template/cmd/* packaging/fpk/template/app/ui/index.cgi packaging/fpk/build.sh; do sh -n "$script"; done
      - run: python scripts/verify_provenance.py
      - run: python -m pip wheel . --no-deps --wheel-dir /tmp/hub-wheel
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
  qq:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-qq.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip wheel '.[qq]' --no-deps --wheel-dir /tmp/hub-wheel
  netease:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r requirements-netease.lock -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m pytest -q
      - run: python -m pip wheel '.[netease]' --no-deps --wheel-dir /tmp/hub-wheel
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: browser-layout-evidence
          path: test-results/
          retention-days: 14
          if-no-files-found: warn
